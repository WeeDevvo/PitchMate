<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      The pre-paint theme bootstrap is NOT written here. It is declared once as
      THEME_BOOTSTRAP_SOURCE in src/theme/themeBootstrap.ts and injected into
      this <head> as a synchronous inline script by the themeBootstrapPlugin
      transformIndexHtml hook in vite.config.ts, so exactly one bootstrap
      declaration exists in the application (Requirements 12.13, 15.7).
    -->

    <!--
      Static base metadata (Requirements 7.1, 7.6). These crawler-safe tags
      mirror the single source of truth in
      src/features/landing/content/landingMetadata.ts (landingMetadataBase) so
      scrapers that do not execute JavaScript still receive valid values.
      The runtime PageHead component owns the live/resolved metadata.
    -->
    <title>PitchMate — Fair teams for casual football</title>
    <meta
      name="description"
      content="PitchMate helps friends organise casual football matches with fair, balanced teams and keeps your results, stats, and leaderboards."
    />

    <!-- Open Graph / social-sharing base tags -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://pitch-mate.co.uk/" />
    <meta property="og:title" content="PitchMate — Fair teams for casual football" />
    <meta
      property="og:description"
      content="PitchMate helps friends organise casual football matches with fair, balanced teams and keeps your results, stats, and leaderboards."
    />
    <meta property="og:image" content="https://pitch-mate.co.uk/og-default.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
