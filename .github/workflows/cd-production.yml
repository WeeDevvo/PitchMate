name: CD · Production (main)

# Deploys to production on merge to `main`, behind a MANUAL APPROVAL gate.
#
# The approval gate is the GitHub `production` environment's "Required
# reviewers" setting — configure it in repo Settings → Environments. Each
# job below targets `environment: production`, so a deploy pauses for reviewer
# sign-off before running.
#
# ┌─ NOT YET LIVE ──────────────────────────────────────────────────────────┐
# │ Guarded by `vars.AZURE_DEPLOY_ENABLED == 'true'` — jobs are SKIPPED      │
# │ until Azure + OIDC + the `production` environment are configured.        │
# │ See docs/walking-skeleton.md for the checklist.                          │
# └──────────────────────────────────────────────────────────────────────────┘
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cd-production
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # Azure login via GitHub OIDC federation

jobs:
  deploy-backend:
    name: Deploy backend
    if: vars.AZURE_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production # required reviewers here = the manual approval gate
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore local tools (dotnet-ef)
        run: dotnet tool restore

      # The migration bundle reads project metadata before it builds, so the packages
      # must already be restored (the API image itself is built by Docker below).
      - name: Restore packages
        run: dotnet restore src/PitchMate.Api

      - name: Produce migration bundle
        run: >-
          dotnet ef migrations bundle
          --project src/PitchMate.Infrastructure
          --startup-project src/PitchMate.Api
          --configuration Release
          --self-contained -r linux-x64
          --output ../publish/efbundle
          --force

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Explicit, out-of-process migration step that completes before the app
      # rollout. Idempotent; stops without partial apply on failure.
      # An Azure Postgres server only admits Azure services, which a GitHub-hosted runner
      # isn't guaranteed to count as. Open it to this runner's IP for the migration step
      # alone, and always close it again. An external database (Supabase in QA) needs none.
      - name: Open the Postgres firewall to this runner
        id: pg-firewall
        env:
          RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP_PROD }}
          PG_SERVER: ${{ vars.AZURE_PG_SERVER_PROD }}
          RULE_NAME: gh-runner-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          if [ -z "$PG_SERVER" ]; then
            echo "No Azure Postgres server configured (AZURE_PG_SERVER_PROD unset); the database is external, so there is no firewall to open."
            exit 0
          fi
          ip=$(curl -fsS https://api.ipify.org)
          az postgres flexible-server firewall-rule create -g "$RESOURCE_GROUP" --server-name "$PG_SERVER" \
            --name "$RULE_NAME" --start-ip-address "$ip" --end-ip-address "$ip" -o none
          echo "opened=true" >> "$GITHUB_OUTPUT"

      - name: Apply migrations (efbundle)
        working-directory: publish
        run: ./efbundle --connection "${{ secrets.DB_CONNECTION_STRING }}"

      - name: Close the Postgres firewall
        if: always() && steps.pg-firewall.outputs.opened == 'true'
        env:
          RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP_PROD }}
          PG_SERVER: ${{ vars.AZURE_PG_SERVER_PROD }}
          RULE_NAME: gh-runner-${{ github.run_id }}-${{ github.run_attempt }}
        run: >-
          az postgres flexible-server firewall-rule delete -g "$RESOURCE_GROUP" --server-name "$PG_SERVER"
          --name "$RULE_NAME" --yes -o none

      # Build backend/Dockerfile, push it to the production registry, and roll the
      # Container App onto it.
      - name: Build, push and deploy the API image
        working-directory: .
        env:
          RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP_PROD }}
          REGISTRY: ${{ vars.AZURE_ACR_NAME_PROD }}
          CONTAINER_APP: ${{ vars.AZURE_CONTAINERAPP_NAME_PROD }}
          TAG: pitchmate-api:prod-${{ github.sha }}
        run: |
          if [ -z "$REGISTRY" ] || [ -z "$CONTAINER_APP" ]; then
            echo "::error::Repository variables AZURE_ACR_NAME_PROD and AZURE_CONTAINERAPP_NAME_PROD must be set."
            exit 1
          fi
          az config set extension.use_dynamic_install=yes_without_prompt -o none
          server=$(az acr show -n "$REGISTRY" --query loginServer -o tsv)
          az acr login -n "$REGISTRY"
          docker build -f backend/Dockerfile -t "$server/$TAG" .
          docker push "$server/$TAG"
          az containerapp update -n "$CONTAINER_APP" -g "$RESOURCE_GROUP" --image "$server/$TAG" -o none

  deploy-web:
    name: Deploy web
    if: vars.AZURE_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      # The web app is served from the Static Web App's origin, so it must be told
      # where the API lives. Vite bakes this in at build time; without it every API
      # call would go same-origin to the static site and fail.
      - name: Build web
        env:
          VITE_API_BASE_URL: ${{ vars.API_BASE_URL_PROD }}
        run: |
          if [ -z "$VITE_API_BASE_URL" ]; then
            echo "::error::Repository variable API_BASE_URL_PROD is not set (e.g. https://<api-app>.azurewebsites.net)."
            exit 1
          fi
          npm run build --workspace @pitchmate/web

      - name: Deploy to Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: apps/web/dist
          skip_app_build: true
          skip_api_build: true
