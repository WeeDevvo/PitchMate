name: CI · Web

# Lint + build gate for the React/Vite app and JS packages. Path-filtered so a
# backend-only change doesn't trigger it.
on:
  pull_request:
    branches: [main, develop]
    paths:
      - "apps/web/**"
      - "packages/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/ci-web.yml"
  push:
    branches: [main, develop]
    paths:
      - "apps/web/**"
      - "packages/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/ci-web.yml"

concurrency:
  group: ci-web-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-build:
    name: Lint & build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json

      # npm workspaces: installs apps/web and packages/* from the root lockfile.
      - name: Install dependencies
        run: npm ci

      # API client drift gate. Regenerates the typed client (packages/api-client/src/schema.d.ts)
      # from the COMMITTED OpenAPI spec (packages/api-client/openapi/v1.json) and fails if the
      # result differs from what's committed — i.e. someone changed the spec but didn't regenerate
      # the client, or hand-edited the generated file.
      #
      # Drift-freedom is guaranteed end to end by two gates working together:
      #   1. THIS job (CI · Web) proves schema.d.ts is in sync with the committed openapi/v1.json.
      #   2. CI · Backend builds PitchMate.Api, which emits openapi/v1.json at build time
      #      (Microsoft.Extensions.ApiDescription.Server) and fails on drift of the committed spec
      #      against the code (see ci-backend.yml).
      # Chaining (1) and (2): code -> committed spec (backend gate) -> committed types (this gate).
      #
      # Residual gap: this job does NOT rebuild the spec from the .NET code (that needs the .NET
      # SDK, which this Node-only job intentionally omits). If the backend spec gate is skipped
      # (e.g. a PR that only touches packages/** so ci-backend's path filter doesn't run) a stale
      # committed spec could pass here. The backend gate covers that on any backend-affecting PR.
      - name: Check API client is in sync with the committed OpenAPI spec
        run: |
          npm run gen --workspace @pitchmate/api-client
          git diff --exit-code -- packages/api-client/src/schema.d.ts

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
