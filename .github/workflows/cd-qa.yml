name: CD · QA (develop)

# Deploys to the QA/staging environment on merge to `develop`.
#
# ┌─ NOT YET LIVE ──────────────────────────────────────────────────────────┐
# │ Every deploy job is guarded by `vars.AZURE_DEPLOY_ENABLED == 'true'`.    │
# │ Until that repo variable is set the jobs are SKIPPED (green, not red).   │
# │ Flip it on once the Azure resources + GitHub OIDC federation + the `qa`  │
# │ environment exist. See docs/walking-skeleton.md for the full runbook.    │
# └──────────────────────────────────────────────────────────────────────────┘
on:
  push:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: cd-qa
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # required for Azure login via GitHub OIDC federation (no long-lived keys)

jobs:
  # ── Backend: migrate (efbundle, explicit step) then deploy the API ────────
  deploy-backend:
    name: Deploy backend
    if: vars.AZURE_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: qa
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore local tools (dotnet-ef)
        run: dotnet tool restore

      # Migrations run as an explicit, out-of-process step BEFORE the app rolls
      # out — never on startup (docs/migrations.md). The bundle embeds every
      # migration and is idempotent (no-op when nothing is pending).
      - name: Produce migration bundle
        run: >-
          dotnet ef migrations bundle
          --project src/PitchMate.Infrastructure
          --startup-project src/PitchMate.Api
          --configuration Release
          --self-contained -r linux-x64
          --output ../publish/efbundle
          --force

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # An Azure Postgres server only admits Azure services, which a GitHub-hosted runner
      # isn't guaranteed to count as. Open it to this runner's IP for the migration step
      # alone, and always close it again. An external database (Supabase in QA) needs none.
      - name: Open the Postgres firewall to this runner
        id: pg-firewall
        env:
          RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP_QA }}
          PG_SERVER: ${{ vars.AZURE_PG_SERVER_QA }}
          RULE_NAME: gh-runner-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          if [ -z "$PG_SERVER" ]; then
            echo "No Azure Postgres server configured (AZURE_PG_SERVER_QA unset); the database is external, so there is no firewall to open."
            exit 0
          fi
          ip=$(curl -fsS https://api.ipify.org)
          az postgres flexible-server firewall-rule create -g "$RESOURCE_GROUP" --server-name "$PG_SERVER" \
            --name "$RULE_NAME" --start-ip-address "$ip" --end-ip-address "$ip" -o none
          echo "opened=true" >> "$GITHUB_OUTPUT"

      - name: Apply migrations (efbundle)
        working-directory: publish
        run: ./efbundle --connection "${{ secrets.DB_CONNECTION_STRING }}"

      - name: Close the Postgres firewall
        if: always() && steps.pg-firewall.outputs.opened == 'true'
        env:
          RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP_QA }}
          PG_SERVER: ${{ vars.AZURE_PG_SERVER_QA }}
          RULE_NAME: gh-runner-${{ github.run_id }}-${{ github.run_attempt }}
        run: >-
          az postgres flexible-server firewall-rule delete -g "$RESOURCE_GROUP" --server-name "$PG_SERVER"
          --name "$RULE_NAME" --yes -o none

      # Build backend/Dockerfile, push it to the environment's registry, and roll the
      # Container App onto it. The names come from repo variables set by
      # infra/configure-qa.ps1.
      - name: Build, push and deploy the API image
        working-directory: .
        env:
          RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP_QA }}
          REGISTRY: ${{ vars.AZURE_ACR_NAME_QA }}
          CONTAINER_APP: ${{ vars.AZURE_CONTAINERAPP_NAME_QA }}
          TAG: pitchmate-api:qa-${{ github.sha }}
        run: |
          if [ -z "$REGISTRY" ] || [ -z "$CONTAINER_APP" ]; then
            echo "::error::Repository variables AZURE_ACR_NAME_QA and AZURE_CONTAINERAPP_NAME_QA must be set (infra/configure-qa.ps1)."
            exit 1
          fi
          az config set extension.use_dynamic_install=yes_without_prompt -o none
          server=$(az acr show -n "$REGISTRY" --query loginServer -o tsv)
          az acr login -n "$REGISTRY"
          docker build -f backend/Dockerfile -t "$server/$TAG" .
          docker push "$server/$TAG"
          az containerapp update -n "$CONTAINER_APP" -g "$RESOURCE_GROUP" --image "$server/$TAG" -o none

  # ── Web: build and deploy the static React app ────────────────────────────
  deploy-web:
    name: Deploy web
    if: vars.AZURE_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: qa
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      # The web app is served from the Static Web App's origin, so it must be told
      # where the API lives. Vite bakes this in at build time; without it every API
      # call would go same-origin to the static site and fail.
      - name: Build web
        env:
          VITE_API_BASE_URL: ${{ vars.API_BASE_URL_QA }}
        run: |
          if [ -z "$VITE_API_BASE_URL" ]; then
            echo "::error::Repository variable API_BASE_URL_QA is not set (e.g. https://<api-app>.azurewebsites.net)."
            exit 1
          fi
          npm run build --workspace @pitchmate/web

      # Upload the pre-built output to Azure Static Web Apps using the QA
      # deployment token. skip_app_build keeps the action from rebuilding.
      - name: Deploy to Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: apps/web/dist
          skip_app_build: true
          skip_api_build: true
